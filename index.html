<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanuja K | Premium Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#0a0f1c;
color:white;
overflow-x:hidden;
}

/* ===== MOVING STARS BACKGROUND ===== */
.stars{
position:fixed;
width:100%;
height:100%;
background:url("https://www.transparenttextures.com/patterns/stardust.png");
animation:moveStars 100s linear infinite;
z-index:-2;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:10000px 5000px;}
}

/* ===== NAVBAR ===== */
nav{
display:flex;
justify-content:space-between;
padding:20px 10%;
position:sticky;
top:0;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:20px;
}

nav a{
color:white;
text-decoration:none;
transition:0.3s;
}

nav a:hover{
color:#00f2fe;
}

/* ===== HERO ===== */
.hero{
text-align:center;
padding:100px 20px;
}

.profile-pic{
width:170px;
height:170px;
border-radius:50%;
border:3px solid #00f2fe;
box-shadow:0 0 25px #00f2fe;
object-fit:cover;
margin-bottom:20px;
}

.typing{
font-size:40px;
font-weight:700;
color:#00f2fe;
}

/* GLOW BUTTON */
.btn{
display:inline-block;
padding:12px 30px;
margin-top:25px;
background:#00f2fe;
color:black;
border-radius:30px;
text-decoration:none;
font-weight:600;
transition:0.3s;
box-shadow:0 0 15px #00f2fe;
}

.btn:hover{
transform:scale(1.1);
box-shadow:0 0 30px #00f2fe;
}

/* ===== GLASS SECTIONS ===== */
.section{
margin:60px 10%;
padding:50px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
border-radius:20px;
opacity:0;
transform:translateY(50px);
transition:1s;
}

.section.show{
opacity:1;
transform:translateY(0);
}

/* CERTIFICATES */
.cert-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
margin-top:30px;
}

.cert-card{
overflow:hidden;
border-radius:15px;
transition:0.4s;
}

.cert-card img{
width:100%;
transition:0.4s;
}

.cert-card:hover img{
transform:scale(1.1);
}

/* CONTACT */
form{
display:flex;
flex-direction:column;
}

form input, form textarea{
margin:12px 0;
padding:12px;
border-radius:10px;
border:none;
}

form button{
padding:12px;
border:none;
background:#00f2fe;
border-radius:25px;
cursor:pointer;
font-weight:600;
}

.social{
margin-top:25px;
}

.social a{
color:white;
font-size:22px;
margin-right:15px;
transition:0.3s;
}

.social a:hover{
color:#00f2fe;
}

/* RESPONSIVE */
@media(max-width:768px){
nav{
flex-direction:column;
align-items:center;
}
.typing{
font-size:28px;
}
}
</style>
</head>

<body>

<div class="stars"></div>

<nav>
<h2>Tanuja K</h2>
<ul>
<li><a href="#about">About</a></li>
<li><a href="#certificates">Certificates</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>

<section class="hero">
<img src="profile.jpg" class="profile-pic" alt="Your Photo">
<div class="typing" id="typing"></div>
<p>Web Developer / Tech Enthusiast</p>
<a href="#contact" class="btn">Contact Me</a>
</section>

<section id="about" class="section">
<h2>About Me</h2>
<p>I love building modern animated websites with clean UI and smooth UX. 
Passionate about frontend technologies and creative design.</p>
</section>

<section id="certificates" class="section">
<h2>My Certificates</h2>
<div class="cert-grid">
<div class="cert-card"><img src="certificate1.jpg"></div>
<div class="cert-card"><img src="certificate2.jpg"></div>
<div class="cert-card"><img src="certificate3.jpg"></div>
</div>
</section>

<section id="contact" class="section">
<h2>Contact Me</h2>
<form id="contactForm">
<input type="text" id="name" placeholder="Your Name" required>
<input type="email" id="email" placeholder="Your Email" required>
<textarea id="message" placeholder="Your Message" required></textarea>
<button type="submit">Send Message</button>
<p id="msg"></p>
</form>

<div class="social">
<a href="#"><i class="fab fa-linkedin"></i></a>
<a href="#"><i class="fab fa-github"></i></a>
<a href="#"><i class="fas fa-envelope"></i></a>
</div>
</section>

<script>

/* ===== TYPING EFFECT ===== */
const text="Tanuja K";
let i=0;
function type(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(type,150);
}
}
type();

/* ===== SCROLL REVEAL ===== */
const sections=document.querySelectorAll(".section");
window.addEventListener("scroll",()=>{
sections.forEach(sec=>{
const top=sec.getBoundingClientRect().top;
if(top<window.innerHeight-100){
sec.classList.add("show");
}
});
});

/* CONTACT */
document.getElementById("contactForm").addEventListener("submit",function(e){
e.preventDefault();
document.getElementById("msg").innerText="Message Sent Successfully!";
document.getElementById("msg").style.color="#00f2fe";
this.reset();
});

</script>

</body>
</html>
